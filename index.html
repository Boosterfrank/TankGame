<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Unnamed Tank Game</title>
  <meta name="description" content="A browser artillery tank game by Qubiplex: destructible terrain, hundreds of weapons, bots and hot-seat multiplayer.">
  <link rel="icon" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="stage">
    <canvas id="game" width="1920" height="920"></canvas>
    <div id="overlay" class="hidden"></div>
    <div id="hud" class="hidden"></div>
    <div id="screens"></div>
    <div id="modal" class="hidden"></div>
    <div id="toasts"></div>
    <div id="chat" class="hidden"></div>
    <div id="devpanel" class="hidden"></div>
    <div id="nowplaying" class="hidden"><span class="np-icon">&#9835;</span><span class="np-title"></span><span class="eq"><i></i><i></i><i></i><i></i><i></i></span><button class="mini np-mute" title="Toggle music">MUTE</button></div>
  </div>
  <noscript>This game needs JavaScript enabled.</noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
