# Cloudflare Worker that hosts online rooms for Unnamed Tank Game.
# Deploy with: npm install && npx wrangler login && npm run deploy
name = "unnamed-tank-game-relay"
main = "src/index.js"
compatibility_date = "2025-10-01"

[durable_objects]
bindings = [
  { name = "ROOM", class_name = "Room" },
  { name = "DIRECTORY", class_name = "Directory" },
]

# SQLite-backed Durable Objects work on the free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Directory"]

[observability]
enabled = true
